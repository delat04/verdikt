<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Verdikt thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap">
<style>
/* Devpost thumbnail, 1800 × 1200 (3:2). The mark large, as on its favicon tile: the work's stroke and the money's
   stroke in cobalt. ?light renders the landing's light version. Weights ≤ 400, Poppins. */
:root { --bg: #0e0f12; --grid: rgba(255,255,255,.045); --work: #ffffff; --ink: #f4f6fb; --muted: #9aa1b2; --accent: #295cff; --glow: rgba(41,92,255,.34); }
:root.light { --bg: #f7f8fa; --grid: rgba(15,19,32,.055); --work: #0e0f12; --ink: #0f1320; --muted: #5b6274; --glow: rgba(41,92,255,.16); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1800px; height: 1200px; overflow: hidden; background: var(--bg); }
body { position: relative; font-family: "Poppins", "Segoe UI", sans-serif; color: var(--ink); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 90px 90px; background-position: -1px -1px; }
.glow { position: absolute; left: 70px; top: 170px; width: 860px; height: 860px; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0%, transparent 62%); }
.mark { position: absolute; left: 140px; top: 240px; width: 720px; height: 720px; }
.text { position: absolute; left: 930px; top: 0; bottom: 0; display: grid; align-content: center; gap: 34px; width: 760px; }
h1 { font-weight: 300; font-size: 188px; line-height: .95; letter-spacing: -0.035em; }
.tag { font-weight: 300; font-size: 56px; line-height: 1.15; letter-spacing: -0.01em; }
.sub { font-weight: 400; font-size: 30px; line-height: 1.3; color: var(--muted); margin-top: 8px; }
</style></head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<svg class="mark" viewBox="0 0 80 80" fill="none" aria-hidden="true">

  <path d="m63.58 9.89c-3.1 0-6.14 1.5-7.53 3.93l-20.28 34.42c-0.3 0.48-0.37 0.77-0.22 1.02l-2.98 5.42c-0.49 0.96-0.87 1.91-0.92 2.66-0.16 2.27 0.02 4.43 0.24 6.46 0.22 2.01 0.09 3.99 0.41 5 0.3 0.89 2 1.31 3.53 1.31 2.39 0 4.89-1.39 6.42-3.34l28.19-47.82c0.43-0.76 0.7-1.64 0.7-2.63 0-3.61-3.67-6.43-7.56-6.43z" fill="var(--accent)"/>

<div class="text">

</body></html>
