<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent session replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* A replay of one real agent run, in Verdikt's system: grey surface, ink, cobalt only for what Claude calls.
   Every message and result comes from the run's transcript. */
:root { --bg: #f7f8fa; --surface: #fff; --ink: #0f1320; --ink-2: #2a3040; --muted: #5b6274; --line: #e2e5ec;
  --accent: #315efb; --accent-soft: #eef2ff; --ok: #16794a; --sans: "Inter Tight", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink-2); font: 300 19px/1.5 var(--sans); overflow: hidden; }
.top { position: fixed; inset: 0 0 auto; height: 76px; display: flex; align-items: center; gap: 14px; padding: 0 48px; background: rgba(247,248,250,.94); border-bottom: 1px solid var(--line); z-index: 2; }
.top h1 { font: 400 20px/1 var(--sans); color: var(--ink); margin: 0 10px 0 0; }
.chip { font: 400 14px/1 var(--mono); color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; white-space: nowrap; }
.chip b { font-weight: 400; color: var(--accent); }
.replay { margin-left: auto; font: 400 14px/1 var(--mono); color: var(--muted); }
#feed { position: absolute; inset: 76px 0 0; overflow: hidden; }
#log { width: 1040px; margin: 0 auto; padding: 28px 0 60px; display: grid; gap: 18px; }
.item { opacity: 0; transform: translateY(8px); transition: opacity .25s ease, transform .25s ease; }
.item.on { opacity: 1; transform: none; }
.who { font: 400 13px/1 var(--mono); color: var(--muted); margin: 0 0 8px; }
.maya { justify-self: end; max-width: 760px; }
.maya .bubble { background: var(--accent-soft); color: var(--ink); border-radius: 14px 14px 4px 14px; padding: 14px 18px; }
.maya .who { text-align: right; }
.claude { max-width: 900px; }
.claude .text { color: var(--ink); }
.claude .text p { margin: 0 0 8px; }
.claude .text strong { font-weight: 400; background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 0 3px; }
.call { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; max-width: 900px; }
.call .head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font: 400 16px/1.3 var(--mono); color: var(--ink); }
.call .head .name { color: var(--accent); }
.call .head .arg { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.call .state { margin-left: auto; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.call .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.call.done .spin { display: none; }
.call .tick { display: none; color: var(--ink); }
.call.done .tick { display: inline; }
@keyframes spin { to { transform: rotate(360deg); } }
.call .body { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: none; gap: 6px; font: 400 15px/1.45 var(--mono); color: var(--ink-2); }
.call.done .body { display: grid; }
.call .body .k { color: var(--muted); }
.call .body .v { color: var(--ink); }
.call .body .src { color: var(--muted); font-size: 13px; }
</style></head>
<body>
<header class="top">
  <h1>Maya's agent</h1>
  <span class="chip">Claude Opus 5.5</span>
  <span class="chip">connected to <b>Verdikt over MCP</b> · 28 tools</span>
  <span class="chip">acting for Maya Chen</span>
  <span class="replay" id="replay"></span>
</header>
<div id="feed"><div id="log"></div></div>
<script>
const RUN = /*RUN*/null
const log = document.getElementById('log'), feed = document.getElementById('feed')
document.getElementById('replay').textContent = `Real run of ${RUN.seconds.toFixed(0)} s, replayed sped up`
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
const md = (s) => s.split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}</p>`).join('')
function add(html, cls) { const el = document.createElement('div'); el.className = 'item ' + cls; el.innerHTML = html; log.appendChild(el); requestAnimationFrame(() => el.classList.add('on')); follow(); return el }
function follow() {
  const to = Math.max(0, log.scrollHeight - feed.clientHeight), from = feed.scrollTop, t0 = performance.now()
  const step = (now) => { const t = Math.min(1, (now - t0) / 450); feed.scrollTop = from + (to - from) * (1 - Math.pow(1 - t, 3)); if (t < 1) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
// Claude's words appear a few at a time, the way they stream in
function stream(el, text, ms) {
  const words = text.split(/(\s+)/), box = el.querySelector('.text'), t0 = performance.now()
  const step = (now) => { const n = Math.ceil(words.length * Math.min(1, (now - t0) / ms)); box.innerHTML = md(words.slice(0, n).join('')); follow(); if (n < words.length) requestAnimationFrame(step) }
  requestAnimationFrame(step)
}
const show = {
  user: (e) => add(`<p class="who">Maya</p><div class="bubble">${esc(e.text)}</div>`, 'maya'),
  claude: (e, a) => { const el = add('<p class="who">Claude</p><div class="text"></div>', 'claude'); stream(el, e.text, a.stream || 1200) },
  call: (e) => add(`<div class="head"><span class="name">${e.name}</span><span class="arg">${esc(e.arg)}</span><span class="state"><span class="spin"></span><span class="tick">✓</span><span class="took"></span></span></div><div class="body">${e.rows.map((r) => `<div><span class="k">${esc(r[0])}</span> <span class="${r[2] || 'v'}">${esc(r[1])}</span></div>`).join('')}</div>`, 'call'),
  done: (e) => { const calls = log.querySelectorAll('.call'); const el = calls[calls.length - 1]; el.querySelector('.took').textContent = e.took; el.classList.add('done'); follow() },
}
window.__play = () => { for (const step of RUN.steps) setTimeout(() => show[step.kind](step, step), step.at * 1000) }
</script>
</body></html>
