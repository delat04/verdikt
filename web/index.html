<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-verified escrow for freelancers, powered by PayPal." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Verdikt — AI-verified escrow</title>
    <script>
      try {
        const t = localStorage.getItem('verdikt-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
