# Render's free plan puts the service to sleep after 15 minutes without traffic, and the next visitor
# waits about a minute for it to wake. A light ping keeps the hosted demo ready, and keeps the server's
# background jobs (renewing PayPal holds, checking for disputes) running.
name: Keep the demo awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the health check
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${APP_URL:-https://verdikt-leg2.onrender.com}/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
