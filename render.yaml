# Render Blueprint — one Docker service: the API, the verifier's Chromium and the web app on one URL.
# Deploy your own copy: New → Blueprint in the Render dashboard, point it at this repo, fill the secrets.
# (Or put the server's .env in a secret file named `.env` instead of filling each secret.)
services:
  - type: web
    name: verdikt
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # read at runtime — secrets
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # or Claude through OpenRouter: when set, used instead of ANTHROPIC_API_KEY
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "2"
      # read at build time — public, they ship to the browser
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_PLATFORM_FEE_PERCENT
        value: "2"
